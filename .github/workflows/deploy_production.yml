name: Deploy to Production Server

on:
  workflow_run:
    workflows: ["Build and Push Production Image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. latest, v1.0.0, sha-xxxxxxx)'
        required: true
        default: 'latest'

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual Trigger: Deploying version ${{ inputs.version }}"
            echo "TARGET_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "Auto Trigger: Deploying latest version"
            # 자동 배포는 항상 latest (혹은 직전 빌드된 태그를 가져올 수도 있음)
            echo "TARGET_VERSION=latest" >> $GITHUB_ENV
          fi

      - name: Deploy to Server components using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          password: ${{ secrets.PRODUCTION_SERVER_PASSWORD }}
          port: ${{ secrets.PRODUCTION_SERVER_PORT }}
          script: |
            START_TIME=$(date +%s)
            IMAGE_TAG="${{ env.TARGET_VERSION }}"
            
            echo "🚀 Starting Production Deployment..."
            echo "Target Image Tag: $IMAGE_TAG"
            
            # 1. 프로젝트 디렉토리 준비
            if [ ! -d "web23-PSI" ]; then
              git clone https://github.com/imjanghyeok/web23-PSI.git
            fi
            cd web23-PSI
            
            # 2. 최신 설정(docker-compose.prod.yml 등) 가져오기
            git fetch origin main
            git checkout main
            git pull origin main
            
            # 3. 환경 변수 주입
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export IMAGE_TAG=$IMAGE_TAG
            # DB 정보 등은 .env 파일이 서버에 이미 존재한다고 가정하거나 Secrets에서 주입 필요
            
            # 4. 배포 (이미지 Pull & Up)
            echo "Download new image ($IMAGE_TAG)..."
            docker compose -f packages/backend/docker-compose.prod.yml pull
            
            echo "Deploy containers..."
            docker compose -f packages/backend/docker-compose.prod.yml up -d --remove-orphans
            
            # 5. 정리 (이전 버전 이미지 삭제)
            docker image prune -a -f
            
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            echo "✅ Deployment Complete"
            echo "⏱️ Time taken: ${DURATION} seconds"
