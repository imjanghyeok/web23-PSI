name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build and Push Image"]
    types:
      - completed
  workflow_dispatch: # 수동 실행 가능

jobs:
  deploy:
    # 빌드 워크플로우가 성공했을 때만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server components using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            START_TIME=$(date +%s)
            echo "🚀 Starting Deployment..."

            # 1. 프로젝트 디렉토리 준비
            if [ ! -d "web23-PSI" ]; then
              git clone https://github.com/imjanghyeok/web23-PSI.git
            fi
            cd web23-PSI
            
            # 2. 최신 설정(docker-compose 등) 가져오기
            git fetch origin cicd
            git checkout cicd
            git pull origin cicd
            
            # 3. 환경 변수 설정
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            
            # 4. 배포 (이미지 Pull & Up)
            echo "Download new image..."
            docker-compose -f packages/backend/docker-compose.dev.yml pull
            
            echo "Deploy containers..."
            docker-compose -f packages/backend/docker-compose.dev.yml up -d
            
            # 5. 정리
            docker image prune -f

            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            echo "✅ Deployment Complete"
            echo "⏱️ Time taken: ${DURATION} seconds"
