name: Monorepo pnpm CI

on:
  push:
    branches: ["main", "develop", "cicd"]
  pull_request:
    branches: ["main", "develop", "cicd"]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 1. 린트, 빌드, 테스트 한 번에 실행 (변경된 패키지만)
      - name: Run Lint & Build (Affected)
        run: npx turbo run lint build --filter=...[origin/develop]

      # 2. 테스트 (항상 실행 - 리포트 생성을 위해)
      # 필터(...[origin/main])를 쓰면 변경사항 없을 때 테스트가 안 돌아가서 리포트 파일이 안 생깁니다.
      # 그래서 리포트를 보려면 필터 없이(또는 backend 명시) 강제로 돌려야 합니다.
      - name: Run Unit Tests
        run: npx turbo run test:ci --filter=backend
        continue-on-error: true

      # 2. 테스트 결과 시각화
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 🧪 Unit Test Results
          path: "packages/**/junit.xml"
          reporter: jest-junit

      # 3. 요약 현황판
      - name: 📊 CI Summary
        if: always()
        run: |
          echo "린트, 빌드, 테스트 상세 결과는 상단 **Checks** 탭에서 확인" >> $GITHUB_STEP_SUMMARY
