name: Build and Push Image

on:
  push:
    branches: ["cicd"]
  workflow_dispatch: # 수동 실행 가능

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Start Timer
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/backend/Dockerfile.dev # 사용자 실수로 local로 바꾼 것을 dev로 원복 (최적화 버전)
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/web23-backend:latest

      - name: End Timer & Report
        if: always()
        run: |
          BUILD_END=$(date +%s)
          DURATION=$((BUILD_END - BUILD_START))
          echo "⏱️ Build & Push Time: ${DURATION} seconds" >> $GITHUB_STEP_SUMMARY
          echo "Build finished in ${DURATION}s"
