name: Build and Push Image

on:
  push:
    branches: ["develop", "main"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------------------------------------------
      # 1. Benchmark: Local Build (Legacy)
      # ----------------------------------------------------------------
      - name: ⏱️ Benchmark - Local Build
        id: local_build
        run: |
          START=$(date +%s)
          docker build -f packages/backend/Dockerfile.local -t benchmark-local .
          END=$(date +%s)
          
          echo "time=$((END - START))" >> $GITHUB_OUTPUT
          SIZE=$(docker images benchmark-local --format "{{.Size}}")
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # 2. Benchmark: Dev Build (Optimized) & Prepare for Push
      # ----------------------------------------------------------------
      - name: ⏱️ Benchmark - Dev Build
        id: dev_build
        run: |
          START=$(date +%s)
          # Push할 태그로 빌드
          docker build -f packages/backend/Dockerfile.dev -t ${{ secrets.DOCKER_USERNAME }}/web23-backend:latest .
          END=$(date +%s)
          
          echo "time=$((END - START))" >> $GITHUB_OUTPUT
          SIZE=$(docker images ${{ secrets.DOCKER_USERNAME }}/web23-backend:latest --format "{{.Size}}")
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      # 3. Push Image (Dev Build 결과 활용)
      - name: Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/web23-backend:latest

      # ----------------------------------------------------------------
      # 4. Report Result
      # ----------------------------------------------------------------
      - name: 📊 Generate Benchmark Report
        if: always()
        run: |
          echo "## 🚀 Docker Build Benchmark Result" >> $GITHUB_STEP_SUMMARY
          echo "| Feature | Local (Legacy) | Dev (Optimized) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Time** | ${{ steps.local_build.outputs.time }}s | ${{ steps.dev_build.outputs.time }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Size** | ${{ steps.local_build.outputs.size }} | ${{ steps.dev_build.outputs.size }} |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note**: 'Dev' build includes production optimization(pnpm deploy), so build time might be slightly longer, but **Image Size** should be much smaller." >> $GITHUB_STEP_SUMMARY
